<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>PBDS — Gestion</title><style>
:root{--g:#0d6b44;--gd:#093f29;--g2:#e8f3ed;--gold:#c8962e;--bg:#f3f6f4;--c:#fff;--t:#14211a;--m:#5d6e65;--b:#e0e7e3;--ok:#1e8e5a;--wa:#d98a00;--er:#c0392b;--in:#2563c9;--sh:0 1px 2px rgba(10,40,25,.06),0 4px 14px rgba(10,40,25,.05);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1511;--c:#16201a;--t:#e8f0ea;--m:#9aaba1;--b:#26352c;--g2:#183625;--sh:none}}
:root[data-theme=dark]{--bg:#0d1511;--c:#16201a;--t:#e8f0ea;--m:#9aaba1;--b:#26352c;--g2:#183625;--sh:none}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--t);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:flex;min-height:100vh}#wrap{flex:1;min-width:0}
#side{width:252px;background:var(--gd);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;display:flex;flex-direction:column;flex-shrink:0;z-index:30}
.brand{display:flex;gap:10px;align-items:center;padding:18px 16px 14px;border-bottom:1px solid #ffffff22}.brand b{display:block;font-size:17px;letter-spacing:.3px}.brand small{opacity:.75;font-size:12px}
.lg{object-fit:contain;background:#fff;border-radius:50%;padding:2px;width:46px;height:46px;flex-shrink:0}
#nav{padding:8px 10px;flex:1}.ng{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;opacity:.55;padding:14px 10px 4px}
#nav a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;color:#ffffffcc;cursor:pointer;font-size:15px;border-left:3px solid transparent;margin:1px 0}#nav a:hover{background:#ffffff14}#nav a.on{background:#ffffff1f;color:#fff;font-weight:600;border-left-color:var(--gold)}
#nav a .nb{margin-left:auto;background:var(--gold);color:#1a1200;border-radius:99px;font-size:12px;font-weight:700;padding:1px 8px}
#who{padding:12px 16px;border-top:1px solid #ffffff22;font-size:13px;opacity:.85}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--c);border-bottom:1px solid var(--b);display:flex;gap:10px;align-items:center;padding:10px 20px}
#mb{display:none;background:none;border:0;font-size:24px;color:var(--t);padding:4px 10px;min-height:44px}
.search{position:relative;flex:1;max-width:560px}.search input{width:100%;background:var(--bg)}#sr{position:absolute;top:46px;left:0;right:0;background:var(--c);border:1px solid var(--b);border-radius:12px;box-shadow:0 8px 30px #0003;max-height:60vh;overflow:auto;z-index:40;display:none}#sr div{padding:10px 14px;border-bottom:1px solid var(--b);cursor:pointer}#sr div:hover{background:var(--g2)}#sr small{color:var(--m)}
#usr{max-width:240px}
main{padding:24px;max-width:1200px;margin:auto}
h2{margin:0 0 4px;font-size:26px;letter-spacing:-.3px;color:var(--t)}h3{margin:0 0 10px;font-size:18px}.sub{color:var(--m);margin:0 0 16px}
.sec{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--m);margin:22px 0 10px;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:6px}
.card,.kpi{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:16px;box-shadow:var(--sh)}.card b{font-size:22px;display:block;color:var(--g)}.card span{color:var(--m);font-size:14px}
.kpi{display:flex;gap:14px;align-items:flex-start}.ic{width:44px;height:44px;border-radius:12px;background:var(--g2);display:grid;place-items:center;font-size:22px;flex-shrink:0}.kpi .l{color:var(--m);font-size:14px}.kpi .v{font-size:22px;font-weight:700;line-height:1.2;margin:2px 0;white-space:nowrap}.kpi .s{font-size:13px;color:var(--m)}.up{color:var(--ok);font-weight:600}.dn{color:var(--er);font-weight:600}
.fin{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0;background:var(--c);border:1px solid var(--b);border-radius:16px;box-shadow:var(--sh);overflow:hidden}.fin>div{padding:16px;border-right:1px solid var(--b)}.fin .l{color:var(--m);font-size:13px}.fin .l{display:block}.fin .v{font-size:20px;font-weight:700;margin-top:2px;white-space:nowrap}
.box{background:var(--c);border:1px solid var(--b);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:15px}th,td{padding:12px 10px;border-bottom:1px solid var(--b);text-align:left;white-space:nowrap}th{color:var(--m);font-size:12px;text-transform:uppercase;letter-spacing:.6px;font-weight:700}tr.cl{cursor:pointer}tr.cl:hover{background:var(--g2)}tr:last-child td{border-bottom:0}
button,a.bs{font:inherit;border-radius:10px;padding:9px 16px;min-height:42px;border:1px solid var(--g);cursor:pointer;background:var(--c);color:var(--g);font-weight:600}button:hover{background:var(--g2)}.b1{background:var(--g);color:#fff;border-color:var(--g)}.b1:hover{background:var(--gd)}.bs{padding:6px 12px;font-size:14px;min-height:34px;margin:1px}.br{border-color:var(--er);color:var(--er)}button:disabled{opacity:.5}
a.bs{text-decoration:none;display:inline-block}
input,select,textarea{font:inherit;padding:10px 12px;min-height:42px;border:1px solid var(--b);border-radius:10px;background:var(--c);color:var(--t);max-width:100%}input:focus,select:focus,textarea:focus{outline:2px solid var(--g);outline-offset:0}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}.bar input{flex:1;min-width:150px}
.bd{padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap;display:inline-block}.bd.g{background:#dff3e6;color:#0b5a2f}.bd.o{background:#ffe9d1;color:#9a4a00}.bd.b{background:#dce9ff;color:#1b4aa8}.bd.r{background:#fde0de;color:#a52a20}.bd.y{background:#fff3c4;color:#7a5b00}.bd.k{background:#e4e7e5;color:#333}
#modal{display:none;position:fixed;inset:0;background:#0a1a1299;z-index:60;overflow:auto;padding:16px}.mc{background:var(--c);max-width:660px;margin:20px auto;border-radius:18px;padding:22px;box-shadow:0 20px 60px #0005}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.fg label{display:flex;flex-direction:column;font-size:14px;color:var(--m);gap:4px;font-weight:600}.ac{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.bw{height:12px;background:linear-gradient(90deg,var(--g),#2fa36b);border-radius:6px}.row{display:grid;grid-template-columns:90px 1fr 130px;gap:10px;align-items:center;font-size:14px;margin:7px 0}.row>div{background:var(--g2);border-radius:6px}
.rc{border:2px solid var(--g);border-radius:14px;padding:18px}.rc h3{color:var(--g);margin:0}.rc td{border:0;padding:4px 0;white-space:normal}.warn{background:#fff3c4;color:#6b4f00;padding:10px 12px;border-radius:10px;margin:10px 0;font-size:14px}
.empty{text-align:center;padding:38px 16px}.empty .ei{font-size:42px}.empty b{display:block;font-size:18px;margin:8px 0 4px}.empty p{color:var(--m);margin:0 0 14px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--b);margin:16px 0}.tabs a{padding:10px 14px;cursor:pointer;white-space:nowrap;color:var(--m);border-bottom:3px solid transparent;font-weight:600}.tabs a.on{color:var(--g);border-color:var(--g)}
.tl{border-left:2px solid var(--b);margin-left:8px;padding-left:18px}.tl div{position:relative;padding:0 0 16px}.tl div:before{content:"";position:absolute;left:-25px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--g);border:2px solid var(--c)}.tl small{color:var(--m);display:block}
.sc{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}.big{font-size:44px;font-weight:800;color:var(--g);line-height:1}.pb{height:10px;background:var(--g2);border-radius:6px;margin:4px 0 10px}.pb i{display:block;height:100%;background:var(--g);border-radius:6px}
.act{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--b);align-items:center}.act:last-child{border:0}.act .ic{width:36px;height:36px;font-size:17px}.act small{color:var(--m)}
.pg{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:12px}
.av{border-radius:50%;object-fit:cover;background:var(--g);color:#fff;display:inline-grid;place-items:center;font-weight:700;vertical-align:middle}.fh{display:flex;gap:18px;flex-wrap:wrap;align-items:center}.ig{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.ig small{display:block;color:var(--m);font-size:13px}.fl{border:1px solid var(--g);color:var(--g);border-radius:10px;padding:6px 12px;font-size:14px;cursor:pointer;display:inline-block;margin-top:6px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#14211a;color:#fff;padding:12px 18px;border-radius:12px;z-index:70;display:none;max-width:90%}
.sk{height:90px;border-radius:16px;margin:10px 0;background:linear-gradient(90deg,var(--g2),var(--b),var(--g2));background-size:200% 100%;animation:sk 1.2s infinite}@keyframes sk{to{background-position:-200% 0}}
th[title]{cursor:pointer;user-select:none}th[title]:hover{color:var(--g)}.tf{width:100%;margin-bottom:10px}.invalid{border-color:var(--er)!important;background:#fdf1f0}.fe{color:var(--er);font-weight:500;min-height:0}.fh{color:var(--m);font-weight:400}.rq{color:var(--er)}.stp{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}.st{padding:5px 12px;border-radius:99px;background:var(--g2);color:var(--m);font-size:13px;font-weight:600}.st.on{background:var(--g);color:#fff}.st.done{background:#dff3e6;color:#0b5a2f}
.mb .sc{display:none}
#modal svg{width:84px;height:84px;display:block}#ov{display:none;position:fixed;inset:0;background:#0007;z-index:25}
@media(max-width:900px){#side{position:fixed;left:0;top:0;height:100%;transform:translateX(-102%);transition:transform .2s}#side.open{transform:none}#side.open~#ov{display:block}#mb{display:block}#top{padding:8px 10px}main{padding:14px}h2{font-size:22px}.cards{grid-template-columns:1fr 1fr}.kpi{flex-direction:column;gap:8px}.fin>div{border-bottom:1px solid var(--b)}#usr{display:none}.mc{margin:6px auto;padding:16px}.row{grid-template-columns:70px 1fr 100px}}
@media(max-width:480px){.kpi{padding:12px}.kpi .v{font-size:18px}.fin>div{padding:12px}.fin .v{font-size:17px}}
@media print{html,body{background:#fff}#app{display:none}#modal{position:static;background:none;display:block!important;padding:0}.mc{max-width:none!important;padding:0!important;box-shadow:none;margin:0}.ac{display:none}.cards{grid-template-columns:repeat(4,1fr)}h3{break-after:avoid}}
